<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Numception</title>
    <meta name="theme-color" content="#05060a" />
    <!-- Placeholder art (ticket 6); self-hosted in public/, base applied by Vite. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        /* Kiln surface, so nothing but the puzzle's colours shows before the first frame. */
        background: #ece3d7;
      }
      body {
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      /* The game surface only: the dev panel's text stays selectable. */
      #app {
        width: 100%;
        height: 100%;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
