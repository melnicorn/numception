name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Read by apps/client/base-path.ts for both the build and the Playwright preview server.
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint:deps
      - run: pnpm test
      # Builds all three flavours into apps/client/dist/{dev,playtest,prod} (AD-18).
      - run: pnpm build
      # Distinct ids across the table, web pages and iOS xcconfig; Android reads the synced config;
      # no dev-panel code in prod. Native shells are not compiled in CI (cost; gap).
      - run: pnpm check:flavours
      # NFR-1: each web flavour's initial download (for the PWA flavours, the whole
      # precached build) within 5,000,000 bytes gzipped.
      - run: pnpm check:budget
      - run: pnpm exec playwright install --with-deps webkit
      # E2E runs against the playtest build, the one deployed to Pages, including the
      # offline reload (NFR-2), which WebKit's service-worker support handles.
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/client/dist/playtest

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
