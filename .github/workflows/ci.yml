name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Read by apps/client/base-path.ts for both the build and the Playwright preview server.
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Import boundaries, lockfile supply check, and the AD-3 purity check of core/generator and core/random.
      - run: pnpm lint:deps
      - run: pnpm test
      # Builds all three flavours into apps/client/dist/{dev,playtest,prod} (AD-18).
      - run: pnpm build
      # Distinct ids across the table, web pages and iOS xcconfig; Android reads the synced config;
      # no dev-panel code in prod. Android compiles in the `android` job; iOS is not compiled in CI (macOS cost).
      - run: pnpm check:flavours
      # NFR-1: each web flavour's initial download (for the PWA flavours, the whole
      # precached build) within 5,000,000 bytes gzipped.
      - run: pnpm check:budget
      - run: pnpm exec playwright install --with-deps webkit
      # E2E runs against the playtest build, the one deployed to Pages, including the
      # offline reload (NFR-2), which WebKit's service-worker support handles. The
      # golden-webkit project replays core's golden seeds in WebKit (AD-6).
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/client/dist/playtest

  # Android shell compile. Builds the playtest flavour (not dev, whose ids equal the Gradle
  # fallback), so a broken synced-config wiring in build.gradle shows up as a wrong package
  # or label. ubuntu-latest ships the Android SDK. Independent of `ci`; never blocks the deploy.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # Same as the cap:sync script, limited to Android: playtest web build at base /, then sync.
      - working-directory: apps/client
        run: BASE_PATH= FLAVOUR=playtest pnpm exec vite build && FLAVOUR=playtest pnpm exec cap sync android
      - working-directory: apps/client/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      # The APK must carry the playtest flavour's package and launcher label (apps/client/flavours.ts).
      - name: Check APK package and label
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT2" dump badging apps/client/android/app/build/outputs/apk/debug/app-debug.apk)
          echo "$BADGING" | grep -E "^package:|^application-label:|launchable-activity"
          echo "$BADGING" | grep -q "^package: name='app.numception.playtest'"
          echo "$BADGING" | grep -q "^application-label:'Numception Playtest'"
          echo "$BADGING" | grep -q "launchable-activity:.*label='Numception Playtest'"

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
