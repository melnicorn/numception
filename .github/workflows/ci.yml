name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Read by apps/client/base-path.ts for both the build and the Playwright preview server.
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint:deps
      - run: pnpm test
      # Builds all three flavours into apps/client/dist/{dev,playtest,prod} (AD-18).
      - run: pnpm build
      # Distinct ids across the table, web pages and iOS xcconfig; Android reads the synced config;
      # no dev-panel code in prod. Android compiles in the `android` job; iOS is not compiled in CI (macOS cost).
      - run: pnpm check:flavours
      # NFR-1: each web flavour's initial download (for the PWA flavours, the whole
      # precached build) within 5,000,000 bytes gzipped.
      - run: pnpm check:budget
      - run: pnpm exec playwright install --with-deps webkit
      # E2E runs against the playtest build, the one deployed to Pages, including the
      # offline reload (NFR-2), which WebKit's service-worker support handles.
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/client/dist/playtest

  # First compile of the Android shell (dev flavour). ubuntu-latest ships the Android SDK;
  # Gradle fetches any missing platform. Independent of `ci`, so it never blocks the deploy.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # Same as the cap:sync script, limited to Android: dev web build at base /, then sync.
      - working-directory: apps/client
        run: BASE_PATH= FLAVOUR=dev pnpm exec vite build && FLAVOUR=dev pnpm exec cap sync android
      - working-directory: apps/client/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - run: test -f apps/client/android/app/build/outputs/apk/debug/app-debug.apk

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
