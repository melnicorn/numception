packages:
  - packages/*
  - apps/*
  - prototypes/renderer-bakeoff/*

# Install scripts of these bmad-dash dependencies are not run (pnpm 11 blocks them by default).
allowBuilds:
  onnxruntime-node: false
  protobufjs: false
  sharp: false

minimumReleaseAgeExclude:
  - '@melnicorn/bmad-dash@1.2.0'
