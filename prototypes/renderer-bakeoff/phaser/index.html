<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Bake-off: Phaser 4</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060a;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
      }
      #readout {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 8px);
        left: calc(env(safe-area-inset-left) + 8px);
        z-index: 1;
        padding: 4px 8px;
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
        color: #e8f6ff;
        background: rgba(5, 6, 10, 0.7);
        border-radius: 4px;
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="readout">fps – · avg – · first frame –</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
