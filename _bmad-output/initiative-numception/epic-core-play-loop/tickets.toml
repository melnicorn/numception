# epic-core-play-loop — agreed children in build order. Table order is the build order; id is not.
# Entries 1-3 are the bare-minimum playable path (user priority 2026-10-14); 4 onwards complete the epic's Done-when.

[[entry]]
id = 1
type = "story"
title = "Tap a puzzle tracer"
description = "Launches straight into the first tier-1 puzzle of a Classic n=3 + round drawn by a new PixiJS render package in Kiln colours: core gains the AD-21 state root (a default Kid profile created through AD-21's Kid defaults), AD-2 StartSession/TapCell with the AD-22 envelope, AD-25 viewPath and core/view selectView with a PlayVM carrying cell geometry and inputLocked; render reaches core/layout only through app (AD-1 lint); a correct tap marks the puzzle solved and enters the next tier-1 puzzle, after the last one the tier-2 puzzle is entered without animation, and solving it starts a new Classic round; every pointer-down draws a same-frame press acknowledgement at the pointer, independent of hit-testing."
verify = "In the playtest preview (and deployed PWA) the first frame is a puzzle, tapping the answer cell shows it solved and the next puzzle appears, tapping a shared edge or the operator does nothing, and core step tests pass headlessly."
covers = ["CAP-3", "CAP-4"]
after = ["1.3", "2.5", "2.6", "2.8"]
hitl = false
risk = "high"
references = ["_bmad-output/initiative-numception/architecture-numception/architecture-numception.md#ad-13-core-owns-view-models-layout-and-guide-state-canvas-draws-play-the-dom-draws-everything-else", "_bmad-output/initiative-numception/architecture-numception/architecture-numception.md#ad-14-the-renderer-port-contract", "_bmad-output/initiative-numception/architecture-numception/architecture-numception.md#ad-21-state-root-and-settings-scope", "_bmad-output/initiative-numception/ux-numception/DESIGN.md", "_bmad-output/initiative-numception/ux-numception/mockups/key-play-n3.html"]

[[entry]]
id = 2
type = "story"
title = "Round flow, tiers and presentation timeline in core"
description = "Completes the round flow as pure state plus its clock: Classic and Tower rounds played breadth-first (a group collapses into its tier-2 cell as it finishes, then the tier-2 puzzles, then the top), tap-to-enter any unsolved cell from an overview (EnterPuzzle) and auto-advance after a solve, onSolve and isComplete on the RoundType registry, the round ending into the next from a simple nextRoundRequest (alternating Classic and Tower at n=3 +, seeded by deriveSeed(rootSeed, roundOrdinal)), an AD-20 presentation timeline (idle, solve, collapse) with durations from a new TuningConfig presentation section and a firstCollapseSeen profile flag choosing the first (3000 ms) or later (1200 ms) collapse, events PuzzleSolved, WrongTap, SoftMiss (each with responseMs), RoundCollapsed and InputDropped, a wrong tap changing no state, and the AD-17 scheduler in app dispatching Tick { elapsedMs } while pauseReasons is empty so the build keeps playing with transitions snapped until entry 3 draws them."
verify = "Headless tests play a Tower n=3 round as 9, 3, then 1 puzzles with a collapse after each group and tier and flow into the next round with no end state, a TapCell during a solve or collapse is dropped with InputDropped, and the playtest preview still plays a full round."
covers = ["CAP-3", "CAP-4"]
after = [1, "2.13"]
hitl = false
risk = "high"
references = ["_bmad-output/initiative-numception/architecture-numception/architecture-numception.md#ad-17-time-comes-from-the-shell-pauses-are-a-set", "_bmad-output/initiative-numception/architecture-numception/architecture-numception.md#ad-20-the-presentation-timeline-is-state", "_bmad-output/initiative-numception/architecture-numception/architecture-numception.md#ad-24-round-types-and-per-round-mode", "_bmad-output/initiative-numception/architecture-numception/architecture-numception.md#ad-25-navigation-is-state"]

[[entry]]
id = 3
type = "story"
title = "Solve and collapse transitions"
description = "Makes the render package play the presentation timeline: the solve transition starts the frame of a correct tap, the camera advances to the next puzzle or enters a tapped overview cell at a capped, non-accelerating zoom velocity, a finished group collapses into its parent with a camera pull-out where an n=3 cell becomes the next-tier puzzle (long first-ever collapse with no guide text, short later), a round flows into the next with a crossfade, every tap gets its press acknowledgement even when dropped, and the scene rebuilds from the view model after a lost WebGL context; hitl step: the user plays a Tower n=3 round on the iPhone and confirms the solve, collapse and crossfade beats."
verify = "On the iPhone, a Tower n=3 round plays end to end — 9, 3, then 1 puzzles with a visible collapse after each group and tier — and flows into the next round with no end screen; a WebKit e2e plays a full Classic round through the canvas using a fixed seed (answers and cell positions from the dev-panel round inspector data path)."
covers = ["CAP-3", "CAP-4", "CAP-5"]
after = [2]
hitl = true
risk = "medium"
references = ["_bmad-output/initiative-numception/ux-numception/DESIGN.md", "_bmad-output/initiative-numception/ux-numception/mockups/key-first-collapse.html"]

[[entry]]
id = 9
type = "story"
title = "Super-shape outline around the zoomed puzzle"
description = "While a puzzle or overview is shown inside a bigger one, draws the parent (super-shape) outline and sibling cells extending around and beyond the frame, with the current puzzle sitting in its cell, so the player sees they are solving part of a larger puzzle before the collapse reveals it; the outline carries through advance and collapse beats."
verify = "On the iPhone, a leaf puzzle shows the faint outline of its tier-2 shape around it with solved siblings visible in their cells, and the user confirms the collapse now reads as completing the super puzzle."
covers = ["CAP-4"]
after = [3]
hitl = true
risk = "medium"
notes = ["Collapse is \"a little weird, not sure it's obvious that we're solving the super puzzle. Perhaps if we extended the super-shape's outline when we zoom in on a node, that might help?\" (user, 2026-10-14)"]

[[entry]]
id = 4
type = "story"
title = "Save and resume"
description = "Persists the state root through a StoragePort backed by IndexedDB in the PWA and in the iPhone shell's WebView for the POC (filesystem adapter deferred to epic-native-apps), with per-profile A/B snapshots, a saveFormatVersion with a forward migration path, saves after each non-Tick batch and on pause that retry silently and never block play, DeviceSettings keeping activeProfileId, and AD-17 Pause/Resume where backgrounding pauses, completes any presentation to its end state and blurs the board until the first tap, which only unblurs, so a killed app relaunches on the same puzzle, solved cells, tier and mode."
verify = "The kill-mid-write test and a migration test pass; a reload mid-round in the playtest preview restores the same puzzle and solved cells with the first frame still a puzzle; after backgrounding, the board is blurred and the first tap only unblurs."
covers = ["CAP-5"]
after = [3]
hitl = false
risk = "high"
references = ["_bmad-output/initiative-numception/architecture-numception/architecture-numception.md#ad-10-persistence-through-one-port-crash-safe", "_bmad-output/initiative-numception/architecture-numception/architecture-numception.md#ad-17-time-comes-from-the-shell-pauses-are-a-set"]

[[entry]]
id = 5
type = "story"
title = "Keyboard play and accessible cells"
description = "Adds web keyboard play (arrow keys in core/layout focus order, Enter or Space to tap, a visible focus ring, Esc reserved for the control surface) and a DOM accessible tree with one button per cell named by its number that hides cell values and announces 'Board hidden. Tap to continue.' while the board is blurred, with cells at least 48 pt and Kid cells at least 56 pt."
verify = "A WebKit e2e solves a Classic round using only the keyboard, an accessibility check finds a named button for every cell, and a layout test confirms every n=3 cell's inscribed circle is at least 56 pt for the Kid profile at the iPhone 16 Pro viewport."
covers = ["CAP-3"]
after = [4]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-numception/ux-numception/DESIGN.md"]

[[entry]]
id = 6
type = "story"
title = "Soft miss presentation and − rounds"
description = "Extends nextRoundRequest to Classic +, Tower +, Classic −, Tower − and presents the FR-4 soft miss (pulse on the tapped cell, ghost arrow toward the answer, and the 'Tap the answer' line shown once per profile through a persisted softMissLineSeen flag), never treated as a wrong tap."
verify = "In a − round, tapping the soft-miss cell shows the pulse and ghost arrow and leaves the puzzle unsolved with no penalty, and the line appears only the first time, including after a reload."
covers = ["CAP-3"]
after = [5]
hitl = false
risk = "low"

