<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Numception key screen · Play view n=3</title>
<style>
/*
Governing spine sections (spine wins on any conflict):
 DESIGN.md  Colors > Theme grammar, Normal themes (Vector Noir), Zen themes (Kiln); Typography (VN 46/34 w300 +.06em; Kiln 44/32 w500);
            Layout & Spacing (375x667, 16px gutter, tap-min, menu button); Elevation & Depth (VN double blur, Kiln tile shadow);
            Shapes > Per-n (3A split triangle); Components: puzzle-cell, operator-cell, timer-line, combo-glow, power-cut, sinking-number, menu-button.
 EXPERIENCE.md  Modes (Zen vs Normal; Timing in Normal); Component Patterns: timer-line, combo-glow, power-cut, sinking-number, menu-button;
            State Patterns: Combo 1.6x, Power cut (Normal), Wrong tap (Zen), Adult profile ring cue; Accessibility Floor (no colour-only state, flashing).
 Geometry: .working/shape-system-1.html 3A (c) phone frame, scale 1.9803 about (187.5,330), offset y+25.
 Theme treatments: .working/directions-1.html Vector Noir + Kiln cards.
 Deliberate departures from directions-1: numerals VN w300 (spine raised from 200); power-cut red halo + looping pulse removed (spine: red on edge only, one fade);
 power-cut lines dim to timer-line-dimmed #266E7A, not #0B3A47; Kiln tiles gain the #AC644E line edge (spine fix).
 Menu position top-right is a placeholder: glyph and position are Open Question 14.
*/

:root{--page:#1b1b1d;--card:#242427;--ink:#ececec;--mute:#a7a7ad;--rule:#3a3a3e;--ok:#8fd694;--warn:#ffb86b}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--page:#f4f4f2;--card:#ffffff;--ink:#1d1d1f;--mute:#5d5d63;--rule:#d9d9dc;--ok:#1f7a2e;--warn:#9a4d00}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:24px 16px 56px;overflow-x:hidden}
header,main{max-width:1240px;margin:0 auto}
h1{font-size:22px;font-weight:600;margin:0 0 6px}
header p{margin:0 0 20px;color:var(--mute);font-size:14px;line-height:1.5;max-width:80ch}
h2{font-size:15px;font-weight:600;margin:28px 0 12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px;min-width:0;max-width:100%}
figure{margin:0;max-width:100%}
figcaption{font-size:13px;line-height:1.45;margin:0 0 10px;max-width:375px}
figcaption b{display:block;font-size:15px;margin-bottom:2px}
svg.phone{display:block;width:375px;max-width:100%;height:auto;border-radius:28px;box-shadow:0 0 0 1px #ffffff1a,0 10px 30px #0006}
ul.notes{margin:10px 0 0;padding-left:18px;font-size:12.5px;line-height:1.5;color:var(--mute);max-width:375px}
svg text{text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums lining-nums}


.vn{font-family:"Avenir Next","Avenir",ui-sans-serif,sans-serif;font-weight:300;letter-spacing:.06em}
.vn.num{font-size:46px} .vn.op{font-size:34px}
.kn{font-family:"Futura","Century Gothic",sans-serif;font-weight:500;letter-spacing:0}
.kn.num{font-size:44px} .kn.op{font-size:32px}
.kn.sink{fill:#CBA491}
.cutfade{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .breathe{animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.84}}
  /* power cut: ONE monotonic fade, lit -> dimmed, 450 ms, runs once on load (reload to replay) */
  .cutfade{animation:cutfade 450ms ease-out 1 both}
  @keyframes cutfade{from{opacity:1}to{opacity:0}}
  /* Zen sinking number: drops 12px and fades to number-sunk, once */
  .kn.sink{animation:sink 600ms ease-out 1 both}
  @keyframes sink{from{transform:translateY(-12px);fill:#A14E36}to{transform:translateY(0);fill:#CBA491}}
}

</style></head><body>
