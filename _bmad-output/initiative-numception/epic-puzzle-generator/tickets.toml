[[entry]]
id = 13
type = "story"
title = "Number ranges by puzzle size"
description = "Lets each tuning band give its value range per puzzle size n (e.g. n 3–5 keeps 1..20 with no carries, larger n widens), so small puzzles stay easy while large Classic and Tower rounds remain plannable; content/tuning/1.json adopts it."
