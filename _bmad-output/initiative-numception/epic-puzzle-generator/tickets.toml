covers = ["CAP-1"]
after = [5]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-numception/architecture-numception/architecture-numception.md#ad-19-tests-are-part-of-the-contract"]

[[entry]]
id = 10
