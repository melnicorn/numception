# epic-platform-baseline — agreed children in build order. Table order is the build order; id is not.

[[entry]]
id = 1
type = "story"
title = "Workspace and CI tracer"
description = "Stands up the pnpm workspace with every Structural Seed package, one value flowing core → app → ui into the client page, typecheck, Vitest and a Playwright WebKit run in CI, and a bare deploy of that page to the static host."
verify = "A push turns CI green and the deployed URL shows a value computed in core."
covers = ["R1", "R4"]
after = []
hitl = true
risk = "medium"
references = ["_bmad-output/initiative-numception/architecture-numception/architecture-numception.md#structural-seed", "_bmad-output/initiative-numception/architecture-numception/research-stack-versions.md"]

