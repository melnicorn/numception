[[entry]]
id = 3
type = "spike"
title = "Renderer decision: measure and record"
description = "Measures both bake-off scenes for fps, gzipped size and cold start on the Galaxy A35-class phone and the iPhone 13 and picks the renderer by the addendum's tie-break rules; if neither holds 60 fps, effect density is cut first, and if the zoom itself cannot hold 60 fps the engine choice is reopened with the user."
verify = "The measurements and the choice are recorded in the architecture spine, and its Stack table names one renderer."
covers = ["R6"]
after = [8, 9]
hitl = true
risk = "high"
references = ["_bmad-output/initiative-numception/architecture-numception/architecture-numception.md#deferred"]

[[entry]]
id = 4
type = "story"
title = "Dependency boundaries and banned-list lint"
description = "Adds dependency-cruiser rules to CI for the package import directions and the banned list (ad, attribution, third-party analytics and crash SDKs, live-update plugins, remote scripts and CDN URLs); prototypes/ is outside the package rules but may not be imported from packages/."
